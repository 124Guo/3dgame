
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>3D 躲避方块</title>
<style>
  body { margin: 0; overflow: hidden; background: #0f1115; touch-action: none; }
  canvas { display: block; }
  #ui { position: absolute; top: 20px; left: 20px; color: #fff; font-family: sans-serif; font-size: 20px; font-weight: bold; pointer-events: none; }
  #overlay { position: absolute; inset: 0; background: rgba(15,17,21,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: sans-serif; z-index: 10; }
  #overlay.hide { display: none; }
  h1 { color: #6ea8fe; margin-bottom: 10px; }
  p { color: #8b93a1; margin-bottom: 30px; }
  button { padding: 12px 30px; font-size: 16px; background: #6ea8fe; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div id="ui">分数: <span id="score">0</span></div>
<div id="overlay">
  <h1>3D 躲避方块</h1>
  <p>左右滑动屏幕控制蓝色方块，躲开红色障碍！</p>
  <button onclick="startGame()">开始游戏</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let scene, camera, renderer, player;
let obstacles = [];
let score = 0, isPlaying = false, speed = 0.4;
let playerLane = 0; 
const laneWidth = 2.5;
let animationId;

function init3D() {
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 3, 7);
  camera.lookAt(0, 0, -10);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x0f1115);
  document.body.appendChild(renderer.domElement);

  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(0, 10, 10);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x404040));

  const playerGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
  const playerMat = new THREE.MeshLambertMaterial({ color: 0x6ea8fe });
  player = new THREE.Mesh(playerGeo, playerMat);
  player.position.y = 0.75;
  player.position.z = 2;
  scene.add(player);

  const gridHelper = new THREE.GridHelper(20, 20, 0x242932, 0x242932);
  gridHelper.position.y = -0.1;
  scene.add(gridHelper);
}

let touchStartX = 0;
window.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: false});
window.addEventListener('touchend', e => {
  if (!isPlaying) return;
  let touchEndX = e.changedTouches[0].clientX;
  let diff = touchEndX - touchStartX;
  if (diff > 30 && playerLane < 1) playerLane++; 
  else if (diff < -30 && playerLane > -1) playerLane--; 
});

function spawnObstacle() {
  const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
  const mat = new THREE.MeshLambertMaterial({ color: 0xef4444 });
  const obs = new THREE.Mesh(geo, mat);
  
  const lane = Math.floor(Math.random() * 3) - 1;
  obs.position.set(lane * laneWidth, 0.75, -30);
  scene.add(obs);
  obstacles.push(obs);
}

function animate() {
  if (!isPlaying) return;
  animationId = requestAnimationFrame(animate);

  player.position.x += (playerLane * laneWidth - player.position.x) * 0.2;

  if (Math.random() < 0.03 + (score * 0.001)) spawnObstacle();

  for (let i = obstacles.length - 1; i >= 0; i--) {
    let obs = obstacles[i];
    obs.position.z += speed;

    if (obs.position.z > 5) {
      scene.remove(obs);
      obstacles.splice(i, 1);
      score++;
      document.getElementById('score').innerText = score;
      speed += 0.002;
    }

    if (Math.abs(obs.position.z - player.position.z) < 1.2 && Math.abs(obs.position.x - player.position.x) < 1.2) {
      gameOver();
      return;
    }
  }
  renderer.render(scene, camera);
}

function startGame() {
  document.getElementById('overlay').classList.add('hide');
  score = 0; speed = 0.4; playerLane = 0; isPlaying = true;
  document.getElementById('score').innerText = score;
  obstacles.forEach(o => scene.remove(o));
  obstacles = [];
  if (animationId) cancelAnimationFrame(animationId);
  animate();
}

function gameOver() {
  isPlaying = false;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hide');
  overlay.innerHTML = `<h1>撞车了！</h1><p>你跑了: <span style="color:#fbbf24;font-size:24px;">${score}</span> 米</p><button onclick="startGame()">再试一次</button>`;
}

init3D();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
